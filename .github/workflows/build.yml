name: Build iOS IPA

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build App Package
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli
          npx cap init "HamoozaApp" "com.hamooza.app" --web-dir .
          
          mkdir -p Payload/hamooza.app
          cp -R * Payload/hamooza.app/ 2>/dev/null || true
          rm -rf Payload/hamooza.app/Payload
          
          # توقيع وهمي Ad-hoc للملف التنفيذي
          codesign --force --deep --sign - Payload/hamooza.app 2>/dev/null || true
          
          zip -r hamooza.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: hamooza-ipa
          path: hamooza.ipa
