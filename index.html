<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quote Generator</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            padding: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }
        p { font-size: 1.2rem; line-height: 1.6; margin-bottom: 25px; min-height: 80px; }
        button {
            background: #38bdf8;
            color: #0f172a;
            border: none;
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:active { transform: scale(0.95); }
    </style>
</head>
<body>
    <div class="card">
        <p id="quote">اضغط على الزر للحصول على نصيحة اليوم 💡</p>
        <button onclick="newQuote()">نصيحة جديدة</button>
    </div>

    <script>
        const quotes = [
            "الاستمرارية أهم بكثير من الشغف اللحظي.",
            "افهم المشكلة جلياً، وسيكون الكود أسهل مما تتوقع.",
            "البساطة هي أقصى درجات التعقيد.",
            "كل خطأ (Bug) تحله اليوم يجعلك برمجيّاً أفضل غداً.",
            "أفضل وقت للبدء كان الأمس، والوقت الثاني الأفضل هو الآن."
        ];
        function newQuote() {
            const random = quotes[Math.floor(Math.random() * quotes.length)];
            document.getElementById('quote').innerText = random;
        }
    </script>
</body>
</html>
